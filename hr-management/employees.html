<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Employee Management - HR Manager">
  <title>Employees | HR Manager</title>
  
  <!-- Design System & Styles -->
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/pages/employees.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar (shared module) -->
    <aside id="app-sidebar" class="app-sidebar" aria-label="Main Navigation"></aside>

    <!-- Main Content Area -->
    <main class="page-content" aria-label="Employee List Content">
      <div class="emp-container">

        <!-- Top Header Bar -->
        <header class="emp-topbar">
          <div class="emp-header-left">
            <div class="emp-page-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </div>
            <div class="emp-header-info">
              <h1 class="emp-page-title">Employee List</h1>
              <p class="emp-page-desc">Manage employee information, departments and employment status.</p>
            </div>
          </div>

          <div class="emp-header-right">
            <button class="notif-btn" type="button" aria-label="Notifications" title="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span class="notif-dot"></span>
            </button>
            <div class="user-profile-badge" title="User Profile">
              <div class="user-avatar-circle">TP</div>
              <span class="user-name">Thang Phan</span>
              <svg class="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>
        </header>

        <!-- KPI Metric Stat Cards (4 cards) -->
        <section class="kpi-grid" aria-label="Employee Statistics">
          <!-- Card 1: Total Employees -->
          <div class="kpi-card">
            <div class="kpi-icon kpi-icon-blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </div>
            <div class="kpi-content">
              <span class="kpi-label">Total Employees</span>
              <strong class="kpi-val" id="stat-total-emp">24</strong>
            </div>
          </div>

          <!-- Card 2: Active Employees -->
          <div class="kpi-card">
            <div class="kpi-icon kpi-icon-green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="kpi-content">
              <span class="kpi-label">Active Employees</span>
              <strong class="kpi-val" id="stat-active-emp">22</strong>
            </div>
          </div>

          <!-- Card 3: Inactive Employees -->
          <div class="kpi-card">
            <div class="kpi-icon kpi-icon-red">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                <path d="m9 9 6 6"></path>
                <path d="m15 9-6 6"></path>
              </svg>
            </div>
            <div class="kpi-content">
              <span class="kpi-label">Inactive Employees</span>
              <strong class="kpi-val" id="stat-inactive-emp">2</strong>
            </div>
          </div>

          <!-- Card 4: Total Departments -->
          <div class="kpi-card">
            <div class="kpi-icon kpi-icon-purple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 21V7l8-4 8 4v14M8 10h2M14 10h2M8 14h2M14 14h2M10 21v-4h4v4M2 21h20"></path>
              </svg>
            </div>
            <div class="kpi-content">
              <span class="kpi-label">Departments</span>
              <strong class="kpi-val" id="stat-total-depts">6</strong>
            </div>
          </div>
        </section>

        <!-- Employee Table Card with Header Filters -->
        <section class="emp-table-card" aria-label="Employee List Table">
          <div class="table-card-header">
            <div class="table-filter-group">
              <!-- Search box -->
              <div class="filter-search-box">
                <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-employee" placeholder="Search by name, employee code, email..." autocomplete="off">
              </div>

              <!-- Department Filter -->
              <div class="filter-select-box">
                <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 21V7l8-4 8 4v14M8 10h2M14 10h2M8 14h2M14 14h2M10 21v-4h4v4M2 21h20"></path>
                </svg>
                <select id="filter-department" aria-label="Filter by department">
                  <option value="">All Departments</option>
                </select>
              </div>

              <!-- Position Filter -->
              <div class="filter-select-box">
                <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="14" x="2" y="7" rx="2" ry="2"></rect>
                  <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                <select id="filter-position" aria-label="Filter by position">
                  <option value="">All Positions</option>
                </select>
              </div>

              <!-- Status Filter: Only Active and Inactive -->
              <div class="filter-select-box">
                <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <select id="filter-status" aria-label="Filter by status">
                  <option value="">All Statuses</option>
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>

            <!-- Add Employee Button -->
            <button type="button" class="btn-add-emp" id="btn-open-add-emp">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Add Employee</span>
            </button>
          </div>

          <div class="table-responsive">
            <table class="emp-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Employee</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Department</th>
                  <th>Position</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="employees-table-body">
                <!-- Populated dynamically by employees.js -->
              </tbody>
            </table>
          </div>

          <!-- Pagination Bar -->
          <div class="table-card-footer">
            <div class="pagination-info" id="pagination-info">
              Showing 1 - 8 of 24 employees
            </div>
            <div class="pagination-controls" id="pagination-controls">
              <!-- Rendered dynamically -->
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- Modal Dialog: Add / Edit Employee -->
  <dialog id="emp-modal" class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-emp-title">Add New Employee</h3>
        <button type="button" class="modal-close-btn" id="btn-close-emp-modal" aria-label="Close dialog">&times;</button>
      </div>

      <form id="emp-form">
        <div class="modal-body">
          <input type="hidden" id="emp-edit-id">

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="emp-code">Employee Code (ID) *</label>
              <input type="text" id="emp-code" class="form-control" placeholder="e.g. NV009" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="emp-name">Full Name (FULL_NAME) *</label>
              <input type="text" id="emp-name" class="form-control" placeholder="e.g. Nguyen Van An" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="emp-email">Email (EMAIL) *</label>
              <input type="email" id="emp-email" class="form-control" placeholder="e.g. an.nguyen@company.com" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="emp-phone">Phone Number (SDT) *</label>
              <input type="tel" id="emp-phone" class="form-control" placeholder="e.g. 0901234567" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="emp-department">Department (ID_DEPARTMENT) *</label>
              <select id="emp-department" class="form-control" required>
                <option value="">-- Select Department --</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="emp-position">Position *</label>
              <input type="text" id="emp-position" class="form-control" placeholder="e.g. Frontend Developer" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="emp-status">Status (STATUS) *</label>
              <select id="emp-status" class="form-control" required>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="emp-avatar">Avatar Photo URL (Optional)</label>
              <input type="url" id="emp-avatar" class="form-control" placeholder="https://images.unsplash.com/...">
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-emp-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-emp">Save Employee</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- ES Modules -->
  <script type="module" src="src/js/shared/sidebar.js"></script>
  <script type="module" src="src/js/pages/employees.js"></script>
</body>
</html>
