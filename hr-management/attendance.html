<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Attendance Management - Track employee attendance and working hours in HR Manager">
  <title>Attendance | HR Manager</title>
  
  <!-- Design System & Styles -->
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/pages/attendance.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar (shared module) -->
    <aside id="app-sidebar" class="app-sidebar" aria-label="Main Navigation"></aside>

    <!-- Main Content Area -->
    <main class="page-content" aria-label="Attendance Content">
      <div class="att-container">
        
        <!-- Top Header Bar (standardized layout) -->
        <header class="att-topbar">
          <div class="att-header-left">
            <div class="att-page-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <polyline points="12 7 12 12 15 15"></polyline>
              </svg>
            </div>
            <div class="att-header-info">
              <h1 class="att-page-title">Attendance</h1>
              <p class="att-page-desc">Track employee attendance and working hours</p>
            </div>
          </div>

          <div class="att-header-right">
            <button class="notif-btn" type="button" aria-label="Notifications" title="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span class="notif-dot"></span>
            </button>
            <div class="user-profile-badge" title="User Profile">
              <div class="user-avatar-circle">TP</div>
              <span class="user-name">Thang Phan</span>
              <svg class="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>
        </header>

        <!-- KPI Metric Stat Cards (4 cards) -->
        <section class="kpi-grid" aria-label="Attendance Summary Metrics">
          <!-- Card 1: Present Today -->
          <div class="kpi-card">
            <div class="kpi-icon kpi-icon-green" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="kpi-content">
              <span class="kpi-label">Present Today</span>
              <strong class="kpi-val" id="kpi-present-count">6</strong>
            </div>
          </div>

          <!-- Card 2: Absent Today -->
          <div class="kpi-card">
            <div class="kpi-icon kpi-icon-red" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              </svg>
            </div>
            <div class="kpi-content">
              <span class="kpi-label">Absent Today</span>
              <strong class="kpi-val" id="kpi-absent-count">1</strong>
            </div>
          </div>

          <!-- Card 3: Late Arrivals -->
          <div class="kpi-card">
            <div class="kpi-icon kpi-icon-yellow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <polyline points="12 7 12 12 15 15"></polyline>
              </svg>
            </div>
            <div class="kpi-content">
              <span class="kpi-label">Late Arrivals</span>
              <strong class="kpi-val" id="kpi-late-count">2</strong>
            </div>
          </div>

          <!-- Card 4: On Leave -->
          <div class="kpi-card">
            <div class="kpi-icon kpi-icon-blue" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
                <path d="M9 16l2 2 4-4"></path>
              </svg>
            </div>
            <div class="kpi-content">
              <span class="kpi-label">On Leave</span>
              <strong class="kpi-val" id="kpi-leave-count">2</strong>
            </div>
          </div>
        </section>

        <!-- Main Attendance Table Card -->
        <section class="att-table-card" aria-label="Attendance Records Section">
          <!-- Filters Bar -->
          <div class="table-card-header">
            <div class="table-filter-group">
              <!-- Search employee input -->
              <div class="filter-search-box">
                <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input 
                  type="text" 
                  id="att-search-input" 
                  placeholder="Search employee..." 
                  aria-label="Search employee by name or ID"
                  autocomplete="off"
                >
              </div>

              <!-- Status Filter Dropdown -->
              <div class="filter-select-box">
                <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <select id="att-status-filter" aria-label="Filter by Status">
                  <option value="all">All Statuses</option>
                  <option value="Present">Present</option>
                  <option value="Late">Late</option>
                  <option value="Absent">Absent</option>
                  <option value="Leave">On Leave</option>
                </select>
              </div>

              <!-- Date Selector Dropdown in Table Card -->
              <div class="filter-select-box filter-date-select">
                <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <button type="button" class="btn-table-date" id="btn-table-date" aria-label="Filter Table by Date">
                  <span id="table-date-label">October 20, 2026</span>
                  <svg class="chevron-mini" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Add Attendance Button -->
            <button type="button" class="btn-add-att" id="btn-open-add-modal" aria-label="Add Attendance">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Add Attendance</span>
            </button>
          </div>

          <!-- Table Container (Scrollable internally) -->
          <div class="table-responsive">
            <table class="att-table">
              <thead>
                <tr>
                  <th scope="col" class="th-employee">Employee</th>
                  <th scope="col" class="th-workdate">Work Date</th>
                  <th scope="col" class="th-checkin">Check In</th>
                  <th scope="col" class="th-checkout">Check Out</th>
                  <th scope="col" class="th-status">Status</th>
                  <th scope="col" class="th-note">Note</th>
                </tr>
              </thead>
              <tbody id="att-table-body">
                <!-- Records injected by attendance.js -->
              </tbody>
            </table>
          </div>

          <!-- Pagination Bar -->
          <div class="table-card-footer" id="att-pagination-bar" aria-label="Pagination">
            <span class="pagination-info" id="att-pagination-info">Showing 1–10 of 10 records</span>
            <div class="pagination-controls" id="att-pagination-controls">
              <!-- Injected by attendance.js -->
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- Modal: Add / Edit Attendance -->
  <div class="att-modal-overlay" id="att-modal" aria-hidden="true">
    <div class="att-modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="att-modal-header">
        <h2 class="att-modal-title" id="modal-title">Add Attendance Record</h2>
        <button type="button" class="att-modal-close" id="modal-close-btn" aria-label="Close modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="att-form" class="att-modal-form">
        <input type="hidden" id="form-record-id">
        
        <div class="att-form-group">
          <label for="form-employee-select" class="att-form-label">Employee <span class="req">*</span></label>
          <select id="form-employee-select" class="att-form-input" required>
            <option value="">-- Select employee --</option>
          </select>
        </div>

        <div class="att-form-row">
          <div class="att-form-group">
            <label for="form-work-date" class="att-form-label">Work Date <span class="req">*</span></label>
            <input type="date" id="form-work-date" class="att-form-input" required>
          </div>
          <div class="att-form-group">
            <label for="form-status" class="att-form-label">Status <span class="req">*</span></label>
            <select id="form-status" class="att-form-input">
              <option value="Present">Present</option>
              <option value="Late">Late</option>
              <option value="Absent">Absent</option>
              <option value="Leave">Leave</option>
            </select>
          </div>
        </div>

        <div class="att-form-row">
          <div class="att-form-group">
            <label for="form-checkin" class="att-form-label">Check In Time</label>
            <input type="time" id="form-checkin" class="att-form-input">
          </div>
          <div class="att-form-group">
            <label for="form-checkout" class="att-form-label">Check Out Time</label>
            <input type="time" id="form-checkout" class="att-form-input">
          </div>
        </div>

        <div class="att-form-group">
          <label for="form-note" class="att-form-label">Note</label>
          <input type="text" id="form-note" class="att-form-input" placeholder="e.g. Traffic delay, Personal leave...">
        </div>

        <div class="att-modal-footer">
          <button type="button" class="att-btn-secondary" id="modal-cancel-btn">Cancel</button>
          <button type="submit" class="att-btn-primary" id="modal-submit-btn">Save Record</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: View Attendance Details -->
  <div class="att-modal-overlay" id="att-view-modal" aria-hidden="true">
    <div class="att-modal-content att-view-modal-content" role="dialog" aria-modal="true" aria-labelledby="view-modal-title">
      <div class="att-modal-header">
        <h2 class="att-modal-title" id="view-modal-title">Attendance Details</h2>
        <button type="button" class="att-modal-close" id="view-modal-close-btn" aria-label="Close details">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="att-view-body" id="att-view-details">
        <!-- Rendered view details -->
      </div>
      <div class="att-modal-footer">
        <button type="button" class="att-btn-secondary" id="view-modal-done-btn">Close</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="src/js/shared/sidebar.js"></script>
  <script type="module" src="src/js/pages/attendance.js"></script>
</body>
</html>
